# req-059-002: UsageMonitor CI 流水线
# 触发：push to main + PR to main；windows-latest runner（Core 依赖 Playwright + WPF + DPAPI，需要 Windows）。
# 失败阻塞 PR 合并（需用户在 GitHub 仓库 Settings → Branches 启用 branch protection）。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一 PR 后续 push 取消上一次 in-progress 运行，避免资源浪费。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # req-059-002: 测试期间禁用 MSBuild 详细日志；失败时用 GitHub Actions UI 即可查看。
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
            ${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore UsageMonitor.sln

      - name: Build solution (Release)
        # req-059-002: 不允许 warning-as-error，避免第三方包警告阻塞 CI。
        # 本项目零警告是目标，但 CI 阶段不强约束。
        run: dotnet build UsageMonitor.sln --no-restore --configuration Release

      # req-059-003: 运行 xUnit 测试并生成 Cobertura 覆盖率报告。
      # coverlet.collector 在测试项目 csproj 中通过 IsTestProject=true 自动启用。
      - name: Run tests with coverage
        run: >
          dotnet test tests/UsageMonitor.Core.Tests/UsageMonitor.Core.Tests.csproj
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults

      # req-059-003: 安装 ReportGenerator 并把 Cobertura 转成可视化 HTML。
      - name: Install ReportGenerator tool
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate HTML coverage report
        shell: pwsh
        run: |
          $reportPaths = Get-ChildItem -Path ./TestResults -Recurse -Filter "coverage.cobertura.xml" | Select-Object -ExpandProperty FullName
          if ($reportPaths.Count -eq 0) {
            Write-Error "No coverage.cobertura.xml found under ./TestResults"
            exit 1
          }
          $reportsArg = ($reportPaths | ForEach-Object { "'$_'" }) -join ";"
          reportgenerator `
            -reports:$reportsArg `
            -targetdir:./coverage/reportgenerator `
            -reporttypes:"HtmlInline_AzurePipelines;Cobertura;Badges" `
            -assemblyfilters:"+UsageMonitor.Core;+UsageMonitor.*;-UsageMonitor.Core.Tests*"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ./TestResults/**/*.trx
            ./TestResults/**/*.cobertura.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage/reportgenerator
          retention-days: 30
          if-no-files-found: warn
