name: Plugin Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  pack:
    name: Pack Plugin Zip
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Pack plugin zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $repoName = "${{ github.event.repository.name }}"
          # zip 名与主仓 publish-portable.ps1 阶段 7 对齐：
          # provider → <id>-<version>.zip；theme/chartstyle/ministyle → <type>-<id>-<version>.zip
          # 注意：不用 ($repoName -split ..., -1) 写法——数组参数会被解释为多 pattern 导致取值错误
          if ($repoName -like 'usage-monitor-plugin-*') {
              $zipName = "$($repoName -replace '^usage-monitor-plugin-', '')-$version.zip"
          } else {
              $zipName = "$($repoName -replace '^usage-monitor-', '')-$version.zip"
          }
          # zip 必须输出到源目录之外（RUNNER_TEMP）：否则 CreateFromDirectory
          # 枚举源目录时会与 zip 自身的写入冲突（file in use）
          $zipPath = Join-Path $env:RUNNER_TEMP $zipName

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::CreateFromDirectory(
            $PWD, $zipPath,
            [System.IO.Compression.CompressionLevel]::Optimal, $true)

          Write-Host "Packed: $zipPath ($([math]::Round((Get-Item $zipPath).Length / 1MB, 1)) MB)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body: |
            Plugin release ${{ github.ref_name }}
            主项目 plugins.lock.json 更新方法见仓库 README。
          files: '${{ runner.temp }}/*.zip'
          fail_on_unmatched_files: true
